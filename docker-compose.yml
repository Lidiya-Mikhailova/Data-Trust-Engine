services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: dte-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DAGSTER_PG_HOST: ${DAGSTER_POSTGRES_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_POSTGRES_PORT:-5432}
      DAGSTER_PG_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    volumes:
      - ./:/app
      - api_data:/app/data
    command: uvicorn API.main:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-8000} ${APP_ENV:+--reload}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      dagster_postgres:
        condition: service_healthy
    networks:
      - dte_network
    restart: unless-stopped

  dagster:
    build:
      context: .
      dockerfile: Dockerfile
      target: dagster
    container_name: dte-dagster
    ports:
      - "${DAGSTER_WEBSERVER_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DAGSTER_PG_HOST: ${DAGSTER_POSTGRES_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_POSTGRES_PORT:-5432}
      DAGSTER_PG_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    volumes:
      - ./:/app
      - dagster_home:/opt/dagster
    depends_on:
      dagster_postgres:
        condition: service_healthy
    command: dagster-webserver -h 0.0.0.0 -p ${DAGSTER_WEBSERVER_PORT:-3000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${DAGSTER_WEBSERVER_PORT:-3000}')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - dte_network
    restart: unless-stopped

  dagster_daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: dagster
    container_name: dte-dagster-daemon
    env_file:
      - .env
    environment:
      DAGSTER_PG_HOST: ${DAGSTER_POSTGRES_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_POSTGRES_PORT:-5432}
      DAGSTER_PG_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    volumes:
      - ./:/app
      - dagster_home:/opt/dagster
    command: dagster-daemon run
    depends_on:
      dagster_postgres:
        condition: service_healthy
    networks:
      - dte_network
    restart: unless-stopped

  dagster_postgres:
    image: postgres:15
    container_name: dte-dagster-postgres
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
    ports:
      - "${DAGSTER_POSTGRES_EXPORT_PORT:-5432}:5432"
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dte_network
    restart: unless-stopped

networks:
  dte_network:
    driver: bridge

volumes:
  api_data:
  dagster_home:
  dagster_postgres_data:
